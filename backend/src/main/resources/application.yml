server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: pet-platform-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.pet.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 业务自定义配置
pet-platform:
  jwt:
    # 不提供公开默认值；启动前必须通过环境变量注入至少 32 字节的随机密钥
    secret: ${JWT_SECRET}
    expire-minutes: 720
    header: Authorization
    prefix: "Bearer "
  geo:
    # 打卡允许的经纬度误差范围（米）
    check-in-radius: 200
  file:
    # 本地上传目录；相对路径按进程工作目录解析，需要固定位置时用 PET_FILE_DIR 指定绝对路径
    dir: ${PET_FILE_DIR:./uploads}
    # 对外访问前缀，须与 WebMvcConfig 的资源映射及鉴权白名单一致
    url-prefix: /uploads
    # 单文件字节上限，须 ≤ spring.servlet.multipart.max-file-size
    max-size: 10485760
