server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: pet-platform-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.petplatform.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 业务自定义配置
pet-platform:
  jwt:
    # 生产环境请通过环境变量覆盖，勿硬编码密钥
    secret: ${JWT_SECRET:pet-platform-default-secret-key-change-me-in-prod-0123456789}
    expire-minutes: 720
    header: Authorization
    prefix: "Bearer "
  geo:
    # 打卡允许的经纬度误差范围（米）
    check-in-radius: 200
